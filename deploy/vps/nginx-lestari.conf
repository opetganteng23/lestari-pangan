# LestariPangan: proxy ke backend di PC on-prem lewat tunnel balik SSH (127.0.0.1:13400 di VPS).
# Mendengarkan hanya di gateway jaringan Docker; HTTPS dan domain ditangani Caddy, sama seperti NOTAM.
# Simpan sebagai /etc/nginx/sites-available/lestari, symlink ke sites-enabled, lalu: nginx -t && systemctl reload nginx
# Tidak ada pembatas laju per-IP di sini: di balik Vercel/Caddy semua permintaan tampak satu IP.
# Pembatas login ada di backend (per IP + email).
server {
    listen 172.19.0.1:13401;
    server_name _;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:13400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;   # PC mati / tunnel putus -> 502 cepat
        proxy_read_timeout 60s;     # asisten AI bisa puluhan detik
    }
}
