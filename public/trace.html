<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telusuri asal pangan · LestariPangan</title><link rel="icon" href="/img/emblem.png"><link rel="stylesheet" href="/app.css">
<style>body{background:#EEF3F0}.ph{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg)}.hd{background:linear-gradient(135deg,#12472A,#237A41);color:#fff;padding:22px 18px 18px}.hd .r{display:flex;align-items:center;gap:10px}.hd img{width:40px;height:40px;background:#fff;border-radius:10px;padding:3px}.hd small{display:block;color:#BFE0CA;font-size:11px}.pad{padding:12px 14px 30px}.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:11px}.c h2{font-size:13.5px;color:var(--g900);margin-bottom:7px;font-weight:700}.ftr{text-align:center;font-size:11px;color:var(--mut);padding:8px 16px 28px}</style></head>
<body><div class="ph" id="ph"><div class="empty">Memuat…</div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=i=>new Date(i).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const PAL=['#237A41','#F2B21B','#2E9150','#245FA3','#9A6212','#C62F2F'];
const code=decodeURIComponent(location.pathname.replace(/^\/t\//,''));
function map(c){if(!c.length)return'';const W=360,H=170,la=c.map(x=>x.lat),lo=c.map(x=>x.lng);const a0=Math.min(...la)-.12,a1=Math.max(...la)+.12,o0=Math.min(...lo)-.18,o1=Math.max(...lo)+.18;const X=v=>(v-o0)/(o1-o0)*(W-60)+30,Y=v=>(a1-v)/(a1-a0)*(H-50)+25;return`<div class="map"><svg viewBox="0 0 ${W} ${H}"><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#DCE8E0"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#g)"/>${c.map((x,i)=>`<circle cx="${X(x.lng)}" cy="${Y(x.lat)}" r="9" fill="${PAL[i%6]}" stroke="#fff" stroke-width="2"/><text x="${X(x.lng)+12}" y="${Y(x.lat)+4}" font-size="9.5" font-family="Poppins" fill="#1C2B22">${esc(x.district.split(',')[0])}</text>`).join('')}</svg></div><p class="small" style="margin-top:6px">Lokasi tingkat kecamatan (skematis).</p>`}
async function load(){const el=document.getElementById('ph');try{const r=await fetch('/api/public/trace/'+encodeURIComponent(code));const t=await r.json();if(!r.ok)throw new Error(t.error);
const ok=t.integrity.verified===t.integrity.events&&t.integrity.chainOk;
el.innerHTML=`<div class="hd"><div class="r"><img src="/img/emblem.png" alt=""><div><b style="font-size:15px">LestariPangan</b><small>Telusuri asal pangan Anda</small></div><span class="demo" style="margin-left:auto">DATA SIMULASI</span></div><div style="margin-top:14px;font-size:18px;font-weight:700">${esc(t.product)}</div><small>Lot ${esc(t.lot)}${t.packedAt?' · dikemas '+dt(t.packedAt):''}${t.qty?' · '+t.qty+' kemasan':''}</small></div>
<div class="pad"><div class="c"><span class="chip ${t.tainted?'bad':ok?'ok':'wait'}"><span class="dot"></span>${t.tainted?'Ada bagian rantai yang ditolak verifikasi':ok?'Jejak tercatat dan hash terverifikasi':'Verifikasi hash tidak lengkap'}</span><p class="small" style="margin-top:7px">${t.integrity.verified} dari ${t.integrity.events} catatan cocok dengan ledger (${esc(t.integrity.network)}). Ini verifikasi teknis atas catatan, bukan jaminan fisik produk.</p><button class="btn sm" id="rv" style="margin-top:8px">Verifikasi ulang sekarang</button></div>
<div class="c"><h2>Asal gabah</h2><div class="bar">${t.composition.map((c,i)=>`<div style="width:${c.pct}%;background:${PAL[i%6]}"></div>`).join('')}</div><div class="small">${t.composition.map((c,i)=>`<div style="margin-bottom:4px"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${PAL[i%6]};margin-right:6px"></i><b>${c.pct}%</b> ${esc(c.name)}<br><span style="margin-left:15px">${esc(c.district)} · ${c.verifiedPct===100?'diverifikasi admin':c.autoPct?'sebagian diterima otomatis':'diverifikasi'}</span></div>`).join('')}</div><p class="small" style="margin-top:6px">Komposisi dihitung proporsional dari bobot setoran. Lokasi tingkat kecamatan.</p></div>
<div class="c"><h2>Peta asal</h2>${map(t.composition)}</div>
<div class="c"><h2>Perjalanan</h2><div class="tl">${t.steps.map(s=>s.gap?`<div class="ev gap"><b style="color:var(--amber)">${esc(s.title)}</b><div class="m">${esc(s.detail)}</div></div>`:`<div class="ev"><b>${esc(s.title)}</b><div class="m">${dt(s.at)}${s.place?' · '+esc(s.place):''}</div><div class="m">${esc(s.detail)}</div>${s.onBehalf?`<div class="m"><span class="chip wait">${esc(s.onBehalf)}</span></div>`:''}</div>`).join('')}</div></div>
${t.holder?`<div class="c"><h2>Posisi saat ini</h2><div class="small">${esc(t.holder.name)} (${esc({gudang:'gudang/penggilingan',retailer:'retailer',distributor:'distributor',pengepul:'pengepul'}[t.holder.role]||t.holder.role)}) · ${esc(t.holder.district)}</div></div>`:''}
<div class="c" style="background:#FDF3D6;border-color:#F0D58A"><h2 style="color:#6b4a00">Yang perlu Anda tahu</h2><p class="small" style="color:#5a4300">Rantai dimulai dari serah terima di pengepul, bukan dari sawah. Asal di hulu didukung kode ketua kelompok, nota bertanda tangan, dan verifikasi admin. Rendemen dan pengolahan dicatat sendiri oleh penggilingan. Tahap tanpa data ditampilkan sebagai celah.</p></div></div><div class="ftr">LestariPangan · Tim TechTonic · prototipe dengan data simulasi</div>`;
document.getElementById('rv').onclick=load;}catch(e){el.innerHTML=`<div class="hd"><b>LestariPangan</b></div><div class="pad"><div class="c"><div class="empty">${esc(e.message)}<br><span class="small">Kode: ${esc(code)}</span></div></div></div>`}}
load();</script></body></html>
